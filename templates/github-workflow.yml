# Copiá este archivo a .github/workflows/parche.yml en tu repo.
# Cada lunes Parche revisa tu código contra la base de cambios de APIs
# y abre un PR por cada cambio que te afecta (en borrador si hay algo para revisar).
name: Parche

on:
  schedule:
    - cron: "17 11 * * 1" # lunes 8:17 (hora de Argentina)
  workflow_dispatch:

# Por defecto, solo lectura. La escritura la pide el único job que la necesita.
# En un repo o una organización nuevos, prendé además Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests": viene apagado, y sin eso la Action no puede abrir el PR.
permissions:
  contents: read

jobs:
  parche:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushear la rama parche/<pack>
      pull-requests: write # abrir el PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Las dependencias del proyecto, para correr sus tests antes de cada PR. Cada paso corre solo si el repo tiene
      # ese archivo: en un repo PHP no hay package-lock.json y `npm ci` fallaría.
      - name: Instalar dependencias de Node
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      # Composer viene instalado en los runners de Ubuntu de GitHub. Si tu proyecto pide otra versión de PHP,
      # agregá antes un paso que la instale.
      - name: Instalar dependencias de PHP
        if: hashFiles('composer.json') != ''
        run: composer install --no-interaction --no-progress
      # v0 se mueve con cada release 0.x. Para fijar una versión, cambiá v0 por el commit de ese release
      # (https://github.com/Pepo08/parche/releases), por ejemplo: Pepo08/parche@<sha> # v0.6.7
      - uses: Pepo08/parche@v0
