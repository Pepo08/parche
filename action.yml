name: Parche API Changes
# En inglés: es la tarjeta del GitHub Marketplace. Menos de 125 caracteres: el Marketplace marcó como larga una más extensa
# (matlab-actions/run-command#12; la documentación no da el número).
description: Dependabot para APIs. Finds API changes that affect your code (ARCA, Mercado Pago, OpenAI, Anthropic) and opens a PR.
author: Joaquin Gonzalez Menza
# Un ícono de Feather que el Marketplace acepta (no acepta `tool`, `key`, `hexagon` y otros).
branding:
  icon: git-pull-request
  color: blue

inputs:
  path:
    description: Carpeta del repo a revisar.
    default: .
  pack:
    description: ID de un solo pack (vacío = todos). Ver `parche packs`.
    default: ''
  verify:
    description: Correr los tests del repo (`npm test`, `composer test` o `vendor/bin/phpunit`) antes de abrir cada PR ('true' o 'false').
    default: 'true'
  dry-run:
    description: Armar las ramas y los cuerpos de los PRs sin abrirlos ('true' o 'false').
    default: 'false'
  token:
    description: Token con permiso para pushear ramas y abrir PRs. Con el GITHUB_TOKEN por defecto, los workflows del PR esperan aprobación; con un token de GitHub App o uno personal, corren solos.
    default: ${{ github.token }}
  snapshot:
    description: Guardar la foto de la corrida (inventario de APIs, avisos y registro, en JSON; sin código) como artifact del workflow ('true' o 'false').
    default: 'true'
  snapshot-name:
    description: Nombre del artifact de la foto. Si usás la Action más de una vez en el mismo workflow, poné un nombre distinto en cada una.
    default: parche
  summary:
    description: "Armar el resumen de la semana (HTML y texto, con el diseño de los mails de Parche) y sumarlo al resumen del job y a la foto ('true' o 'false'). Necesita la foto. Para comparar con la semana anterior, el workflow necesita `actions: read`."
    default: 'true'
  ai-upgrades:
    description: A prueba (nivel 2). Para los SDKs de npm con llamadas que cambian en su última versión, un modelo de IA propone el arreglo con tu clave, Parche lo verifica (sintaxis, tipos y, con `verify`, tus tests) y abre un PR en borrador. Nunca en facturación, pagos ni modelos de IA ('true' o 'false').
    default: 'false'
  ai-model:
    description: El modelo para `ai-upgrades`.
    default: claude-opus-5-5
  anthropic-api-key:
    description: Tu clave de la API de Anthropic para `ai-upgrades`, como un secret del repo (por ejemplo, secrets.ANTHROPIC_API_KEY). Solo la usa ese paso.
    default: ''

runs:
  using: composite
  steps:
    - name: Instalar Parche
      shell: bash
      run: npm ci --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
    - name: Parche
      id: pr
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PARCHE_DEFAULT_TOKEN: ${{ inputs.token == github.token }}
        PARCHE_PACK: ${{ inputs.pack }}
        PARCHE_VERIFY: ${{ inputs.verify }}
        PARCHE_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        args=(pr .)
        if [ -n "$PARCHE_PACK" ]; then args+=(--pack "$PARCHE_PACK"); fi
        if [ "$PARCHE_VERIFY" = "true" ]; then args+=(--verify); fi
        if [ "$PARCHE_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        node "$GITHUB_ACTION_PATH/bin/parche.js" "${args[@]}"
    # El nivel 2, a prueba (0.9.0): apagado salvo `ai-upgrades: 'true'`. La clave solo llega a este paso. Si falla (por
    # ejemplo, sin clave), la corrida falla: quien lo prendió tiene que enterarse.
    - name: Arreglos con IA (a prueba)
      if: ${{ !cancelled() && inputs.ai-upgrades == 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        PARCHE_AI_MODEL: ${{ inputs.ai-model }}
        PARCHE_VERIFY: ${{ inputs.verify }}
        PARCHE_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        args=(ai-upgrade .)
        if [ "$PARCHE_VERIFY" = "true" ]; then args+=(--verify); fi
        if [ "$PARCHE_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        node "$GITHUB_ACTION_PATH/bin/parche.js" "${args[@]}"
    # La foto de la corrida (P1 de la vigilancia): `scan --json` (inventario y avisos, cada uno con su fingerprint) y el
    # registro de esta corrida (los PRs que abrió y lo que quedó sin PR). Sin esto, todo eso se perdía con el runner.
    # También corre si `parche pr` falló (por ejemplo, en la verificación), y si la foto falla no hace fallar la corrida.
    - name: Foto de la corrida
      if: ${{ !cancelled() && inputs.snapshot == 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PARCHE_PACK: ${{ inputs.pack }}
        PARCHE_SNAPSHOT_NAME: ${{ inputs.snapshot-name }}
      run: |
        dir="$RUNNER_TEMP/parche-snapshot/$PARCHE_SNAPSHOT_NAME"
        mkdir -p "$dir"
        args=(scan . --json)
        if [ -n "$PARCHE_PACK" ]; then args+=(--pack "$PARCHE_PACK"); fi
        if node "$GITHUB_ACTION_PATH/bin/parche.js" "${args[@]}" > "$dir/scan.json"; then
          if [ -f .parche/ledger.jsonl ]; then cp .parche/ledger.jsonl "$dir/ledger.jsonl"; fi
        else
          rm -f "$dir/scan.json"
          echo "::warning title=Parche::No se pudo armar la foto de la corrida; los PRs y el resumen del job no cambian."
        fi
    # El resumen de la semana (0.8.0): con la foto de esta corrida, la de la semana anterior (si el workflow tiene
    # `actions: read`) y los PRs de Parche, arma el mail semanal con el diseño de templates/resumen/. No lo manda: lo suma
    # al resumen del job y lo deja en la foto (resumen.html, resumen.txt y resumen.json). Si falla, la corrida no falla.
    - name: Resumen de la semana
      if: ${{ !cancelled() && inputs.snapshot == 'true' && inputs.summary == 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PARCHE_SNAPSHOT_NAME: ${{ inputs.snapshot-name }}
        PARCHE_PR_OUTCOME: ${{ steps.pr.outcome }}
      run: |
        dir="$RUNNER_TEMP/parche-snapshot/$PARCHE_SNAPSHOT_NAME"
        if [ -f "$dir/scan.json" ]; then
          node "$GITHUB_ACTION_PATH/bin/parche.js" summary --snapshot "$dir" \
            || echo "::warning title=Parche::No se pudo armar el resumen de la semana; los PRs y la foto no cambian."
        fi
    - name: Guardar la foto como artifact
      if: ${{ !cancelled() && inputs.snapshot == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.snapshot-name }}
        path: ${{ runner.temp }}/parche-snapshot/${{ inputs.snapshot-name }}
        if-no-files-found: warn
