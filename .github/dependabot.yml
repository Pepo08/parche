# Mantiene al día las Actions fijadas por SHA en los workflows y las dependencias de npm.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # TypeScript 7 es nativo y no trae la API de JavaScript que usa el diff de SDKs (decisión D27): se queda en 6.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Babel 8 rechaza TypeScript válido (`declare global { var x }` seguido de `const x`), pide Node 22.18 y no suma detección.
      # jscodeshift sigue en Babel 7, así que quedarían las dos versiones. Se mira de nuevo cuando pase a Babel 8.
      - dependency-name: "@babel/parser"
        update-types: ["version-update:semver-major"]
